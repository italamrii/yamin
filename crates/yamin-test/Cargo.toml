[package]
name = "yamin-test"
version = "0.1.0"
edition = "2021"
description = "Conformance test catalog for Arabic BiDi + shaping in terminal emulators"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal_size = "0.4"

[dev-dependencies]
unicode-bidi = "0.3"
